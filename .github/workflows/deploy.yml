# Deploy workflow — builds and publishes to GitHub Pages on every push to main.
# Custom domain: the site is served at the apex root https://jmaff.dev/, so the
# build uses --base-href "/" and src/CNAME (registered in angular.json assets) is
# copied into the published output on every deploy, surviving keep_files: false.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions needed to push to gh-pages
permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        # Served at the apex custom domain https://jmaff.dev/, so base-href is "/".
        # (For a project-site deployment at /PersonalWebsite/ this would need to
        #  match the repository name instead.)
        run: npm run build -- --base-href /

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/personal-website/browser
          # keep_files: false wipes gh-pages on each deploy; the custom-domain
          # CNAME survives because it ships inside the build output (src/CNAME,
          # registered in angular.json assets) rather than living only on gh-pages.
          keep_files: false
